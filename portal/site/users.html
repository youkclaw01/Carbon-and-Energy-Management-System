<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMA 계정 관리</title>
<link rel="stylesheet" href="style.css?v=5.9"><link rel="stylesheet" href="style2.css?v=7.3"><link rel="stylesheet" href="luxe.css?v=5.9"><script src="skins.js?v=7.3"></script>
<style>html,body{background:transparent;min-height:0}body{display:block;padding:10px 4px}main{max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:var(--rad,12px);padding:16px 18px;box-shadow:var(--shadow)}
h1{font-size:18px;margin:0 0 12px}h2{font-size:15px;margin:16px 0 6px}label{display:block;font-size:12px;margin:10px 0 4px;color:var(--mut)}
input,select{width:100%;background:var(--sel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
button{margin-top:12px;width:100%;padding:9px;border-radius:8px;background:var(--btn);color:var(--btntxt,var(--txt));border:1px solid var(--btnb,var(--btn));font:inherit;font-weight:600;cursor:pointer}button:hover{background:var(--btnh,var(--btn))}button.s{background:var(--sel);color:var(--txt);border:1px solid var(--line);font-weight:500}button.s:hover{background:var(--navhov,var(--sel))}button:disabled{opacity:.5;cursor:not-allowed}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:var(--txt);font-weight:600;padding:4px 0}
.msg{margin-top:10px;font-size:13px;min-height:18px}.err{color:var(--rd)}.ok{color:var(--gr)}code{display:block;word-break:break-all;background:var(--sel);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;font-size:13px}.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}a{color:var(--cy)}.sect{margin-top:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row button{width:auto;margin:0;padding:7px 12px}.mut{color:var(--mut);font-size:12px;line-height:1.5}#m{min-height:18px;font-size:13px;margin:6px 0}
#list .card{margin:10px 0;padding:12px 14px}#list .card h3{margin:0 0 4px;font-size:15px;justify-content:flex-start}#list .card .row{margin:8px 0 0}#list .card select{width:auto;min-width:96px;padding:7px 10px}
.tag{font-size:11px;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:400}.tag.act{color:var(--gr);border-color:var(--gr)}.tag.dis{color:var(--rd);border-color:var(--rd)}.tag.pen{color:var(--yl);border-color:var(--yl)}
button.p{background:var(--btn);color:var(--btntxt,var(--txt));border:1px solid var(--btnb,var(--btn))}button.d{background:transparent;color:var(--rd);border:1px solid var(--rd)}button.d:hover{background:var(--ber,transparent)}.emb body{padding:0}.emb main{max-width:none;background:transparent;border:0;box-shadow:none;padding:6px 2px 24px}.emb #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}.emb #list .card{margin:0}.emb .sect,.emb details{max-width:760px}</style></head><body><script>if(window.parent!==window)document.documentElement.classList.add('emb')</script><main>
<h1>계정 관리</h1><div class="mut"><a href="/#account" target="_top">← 내 계정</a> · 관리자(MFA 로그인)만 사용할 수 있습니다.</div>
<div class="row"><select id="f"><option value="all">전체</option><option value="pending">가입 대기</option><option value="active">활성</option><option value="disabled">비활성</option><option value="rejected">거절</option></select><button id="r">새로고침</button></div><div id="m"></div><div id="list"></div></main>
<script>
const B='/api/approval/v1',$=i=>document.getElementById(i);const tok=sessionStorage.getItem('ama_tok');const GR={viewer:'조회',operator:'운영(신청)',approver:'승인자',admin:'관리자'};const ST={active:'활성',disabled:'비활성',pending:'가입 대기',rejected:'거절'};
function msg(t,ok){$('m').textContent=t;$('m').style.color=ok?'var(--gr)':'var(--rd)'}
async function api(m,p,b){const h={'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;const r=await fetch(B+p,{method:m,headers:h,body:b?JSON.stringify(b):undefined,cache:'no-store'});let d={};try{d=await r.json()}catch(e){}return [r.status,d]}
const mk=(t,c,f)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=f;return b};
async function act(p,b,okmsg){const [c,d]=await api('POST',p,b);if(c==200){if(d.temporaryPassword){prompt('임시 비밀번호(한 번만 표시됩니다. 복사해서 사용자에게 전달하세요)',d.temporaryPassword)}msg(okmsg,1);load()}else msg(d.message||'실패')}
async function load(){const [c,d]=await api('GET','/admin/users?state='+$('f').value);const box=$('list');box.innerHTML='';if(c!=200){msg(c==401?'로그인이 필요합니다. 내 계정 페이지에서 로그인하세요.':(d.code=='MFA_REQUIRED'?'MFA로 로그인한 세션이 필요합니다.':(d.message||'실패')));return}msg(d.items.length+'명',1);
d.items.forEach(x=>{const e=document.createElement('div');e.className='card';const t=document.createElement('div');const b=document.createElement('b');b.textContent=x.username;const tg=document.createElement('span');tg.className='tag '+(x.state=='active'?'act':x.state=='disabled'?'dis':x.state=='pending'?'pen':'');tg.textContent=ST[x.state]||x.state;t.append(b,tg);
const i=document.createElement('div');i.className='mut';i.textContent=(x.displayName||'-')+' · '+(x.email||'이메일 없음')+' · 등급 '+(GR[x.grade]||'-')+' · MFA '+(x.mfaEnrolled?'등록':'미등록')+' · 지문 '+x.passkeys+'개 · 가입 '+String(x.createdAt).slice(0,16);e.append(t,i);const r=document.createElement('div');r.className='row';
if(x.state=='active'){const s=document.createElement('select');Object.keys(GR).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=GR[k];if(k==x.grade)o.selected=true;s.appendChild(o)});r.append(s,mk('등급 적용','p',()=>act('/admin/users/grade',{username:x.username,grade:s.value},x.username+' 등급 변경')),mk('비활성화','d',()=>confirm(x.username+' 계정을 비활성화할까요? 로그인 중인 세션도 끊깁니다.')&&act('/admin/users/status',{username:x.username,status:'disabled'},'비활성화')),mk('MFA·지문 초기화','',()=>confirm('MFA와 지문을 초기화할까요?')&&act('/admin/users/reset-mfa',{username:x.username},'초기화')),mk('임시 비밀번호','',()=>confirm('임시 비밀번호를 새로 만들까요? 기존 비밀번호는 즉시 무효가 됩니다.')&&act('/admin/users/reset-password',{username:x.username},'임시 비밀번호 발급')))}
else if(x.state=='disabled')r.append(mk('활성화','p',()=>act('/admin/users/status',{username:x.username,status:'active'},'활성화')));
else if(x.state=='pending'){const s=document.createElement('select');Object.keys(GR).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=GR[k];s.appendChild(o)});r.append(s,mk('승인','p',()=>act('/admin/signups/decision',{username:x.username,decision:'approve',grade:s.value},'승인')),mk('거절','d',()=>act('/admin/signups/decision',{username:x.username,decision:'reject'},'거절')))}
e.append(r);box.appendChild(e)})}
$('f').onchange=load;$('r').onclick=load;load();
</script></body></html>
